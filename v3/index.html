<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher's Gradebook</title>
  <link rel="stylesheet" href="./complextable.css">
  <script src="./complextable.js"></script>
</head>
<body>
  <div class="page">
    <!-- ======== HEADER (fixed at top) ======== -->
    <header>
      <h1>Teacher's Gradebook</h1>
    </header>

    <!-- ======== MAIN CONTENT ======== -->
    <div class="main-content">
      <!--
        Top Scrollbar: A custom container that mirrors the table's horizontal
        scroll extent. A dummy <div> inside is resized by JS to match the
        table's scrollWidth, creating a synchronized scrollbar.
      -->
      <div class="top-scrollbar-container" id="topScrollbar">
        <div class="top-scrollbar-dummy" id="topScrollbarDummy"></div>
      </div>

      <!--
        Table Container Wrapper: overflow:hidden clips the horizontal scrollbar.
        It does NOT scroll itself, so it is not a scroll ancestor —
        position:sticky inside .table-container still works correctly.

        Table Container: Single scroll container (overflow:auto both axes).
        height: calc(100% + 15px) extends it below the wrapper so the native
        horizontal scrollbar is clipped. Vertical scrollbar stays visible.
      -->
      <div class="table-container-wrapper">
        <div class="table-container" id="tableContainer">
          <table id="gradebookTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ======== FOOTER (fixed at bottom) ======== -->
    <footer>
      <span id="footerInfo">Loading...</span>
      <span>Teacher's Gradebook v1.0</span>
    </footer>
  </div>

  <script>
    /**
     * ================================================================
     * Mock Data & Initialization
     * ================================================================
     *
     * This script is the ONLY place with domain knowledge (students,
     * assignments, grades). It generates mock data and feeds it into
     * the generic Gradebook class above.
     */
    (function () {
      'use strict';

      /* ==============================================================
         CONFIGURATION
         ============================================================== */
      const TOTAL_COLS = 15;        // 1 name + 12 assignments + 1 average + 1 grade
      const NUM_ASSIGNMENTS = TOTAL_COLS - 3; // 12

      const GROUPS_CONFIG = [
        { name: 'Class 1A', size: 8  },
        { name: 'Class 1B', size: 10 },
        { name: 'Class 2A', size: 7  },
      ];

      /* ==============================================================
         NAME POOLS
         ============================================================== */
      const FIRST_NAMES = [
        'Emma', 'Liam', 'Olivia', 'Noah', 'Ava', 'Ethan', 'Sophia', 'Mason',
        'Isabella', 'William', 'Mia', 'James', 'Charlotte', 'Benjamin', 'Amelia',
        'Lucas', 'Harper', 'Henry', 'Evelyn', 'Alexander', 'Abigail', 'Michael',
        'Emily', 'Daniel', 'Elizabeth', 'Jacob', 'Sofia', 'Logan', 'Avery',
        'Jackson', 'Ella', 'Sebastian', 'Scarlett', 'Aiden', 'Grace', 'Matthew',
        'Victoria', 'Samuel', 'Riley', 'David', 'Aria', 'Joseph', 'Lily',
        'Carter', 'Aurora', 'Owen', 'Chloe', 'Wyatt', 'Penelope', 'John',
        'Layla'
      ];

      const LAST_NAMES = [
        'Smith', 'Johnson', 'Williams', 'Brown', 'Jones', 'Garcia', 'Miller',
        'Davis', 'Rodriguez', 'Martinez', 'Hernandez', 'Lopez', 'Gonzalez',
        'Wilson', 'Anderson', 'Thomas', 'Taylor', 'Moore', 'Jackson', 'Martin',
        'Lee', 'Perez', 'Thompson', 'White', 'Harris', 'Sanchez', 'Clark',
        'Ramirez', 'Lewis', 'Robinson', 'Walker', 'Young', 'Allen', 'King',
        'Wright', 'Scott', 'Torres', 'Nguyen', 'Hill', 'Flores', 'Green',
        'Adams', 'Nelson', 'Baker', 'Hall', 'Rivera', 'Campbell', 'Mitchell',
        'Carter', 'Roberts'
      ];

      const MONTHS = [
        'Sep', 'Sep', 'Sep', 'Oct', 'Oct', 'Oct', 'Nov', 'Nov',
        'Nov', 'Dec', 'Dec', 'Jan', 'Jan', 'Feb', 'Feb', 'Feb',
        'Mar', 'Mar', 'Mar', 'Apr', 'Apr', 'Apr', 'May'
      ];

      /* ==============================================================
         HELPER FUNCTIONS
         ============================================================== */

      function generateStudentName(index) {
        const first = FIRST_NAMES[index % FIRST_NAMES.length];
        const last = LAST_NAMES[index % LAST_NAMES.length];
        const cycle = Math.floor(index / FIRST_NAMES.length);
        if (cycle > 0) {
          return last + ', ' + first + ' ' + String.fromCharCode(65 + cycle);
        }
        return last + ', ' + first;
      }

      function randomInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      }

      /* ==============================================================
         GENERATE HEADER ROWS
         ============================================================== */
      function generateHeaders1() {
        const row1 = [''];

        for (let a = 0; a < NUM_ASSIGNMENTS; a++) {
          row1.push('Unidad ' + (a + 1));
        }

        row1.push('Average');
        row1.push('Weighted Average');

        return [{ lines: 2, cells: row1 }];
      }

      function generateHeaders2() {
        const row1 = [''];
        const row2 = [''];

        for (let a = 0; a < NUM_ASSIGNMENTS; a++) {
          row1.push('Asgn ' + (a + 1));
          const month = MONTHS[a % MONTHS.length];
          const day = randomInt(1, 28);
          row2.push(month + ' ' + day + '\n100 pts');
        }

        row1.push('Average');
        row2.push('Weighted');
        row1.push('Weighted Average');
        row2.push('Letter Grade');

        return [
          { lines: 2, cells: row1 },
          { lines: 2, cells: row2 }
        ];
      }

      /* ==============================================================
         GENERATE A SINGLE STUDENT ROW
         ============================================================== */
      function generateStudentRow(index) {
        const row = [];
        row.push(generateStudentName(index));

        let sum = 0;
        for (let a = 0; a < NUM_ASSIGNMENTS; a++) {
          const score = randomInt(45, 100);
          row.push(score);
          sum += score;
        }

        const avg = (sum / NUM_ASSIGNMENTS).toFixed(1);
        row.push(avg);

        const avgNum = parseFloat(avg);
        let grade;
        if (avgNum >= 90)      grade = 'A';
        else if (avgNum >= 80) grade = 'B';
        else if (avgNum >= 70) grade = 'C';
        else if (avgNum >= 60) grade = 'D';
        else                   grade = 'F';
        row.push(grade);

        return row;
      }

      /* ==============================================================
         COMPUTE GROUP AVERAGES ROW
         Averages each assignment column across all student rows in a
         group, then computes the overall average and letter grade.
         ============================================================== */
      function computeGroupAveragesRow(groupRows) {
        const row = ['Group Average'];
        let r, a, grade;

        // Average for each assignment column (cols 1 … NUM_ASSIGNMENTS)
        for (let a = 0; a < NUM_ASSIGNMENTS; a++) {
          let colSum = 0;
          for (let r = 0; r < groupRows.length; r++) {
            colSum += parseFloat(groupRows[r][1 + a]) || 0;
          }
          row.push((colSum / groupRows.length).toFixed(1));
        }

        // Overall average (mean of student averages in col NUM_ASSIGNMENTS + 1)
        const avgColIndex = 1 + NUM_ASSIGNMENTS;
        let colSum = 0;
        for (let r = 0; r < groupRows.length; r++) {
          colSum += parseFloat(groupRows[r][avgColIndex]) || 0;
        }
        const groupAvg = colSum / groupRows.length;
        row.push(groupAvg.toFixed(1));

        if (groupAvg >= 90)      grade = 'A';
        else if (groupAvg >= 80) grade = 'B';
        else if (groupAvg >= 70) grade = 'C';
        else if (groupAvg >= 60) grade = 'D';
        else                     grade = 'F';
        row.push(grade);

        return row;
      }

      /* ==============================================================
         GENERATE ALL GROUPS
         ============================================================== */
      function generateGroups() {
        const groups = [];
        let studentIndex = 0;

        for (let g = 0; g < GROUPS_CONFIG.length; g++) {
          const cfg = GROUPS_CONFIG[g];
          const rows = [];

          for (let s = 0; s < cfg.size; s++) {
            rows.push(generateStudentRow(studentIndex));
            studentIndex++;
          }

          groups.push({
            name: cfg.name,
            rows: rows,
            averagesRow: computeGroupAveragesRow(rows)
          });
        }

        return groups;
      }

      /* ==============================================================
         BUILD CELL CLASSES MAP
         Per-column CSS classes for body cells.
         ============================================================== */
      function buildCellClasses() {
        const classes = {};
        const firstFixedRight = TOTAL_COLS - 2; // index 23

        // Assignment score columns: center-align
        for (let c = 1; c < firstFixedRight; c++) {
          classes[c] = 'score-cell';
        }
        // Average column: center-align
        classes[firstFixedRight] = 'score-cell';
        // Final Grade column: bold center
        classes[TOTAL_COLS - 1] = 'score-cell';

        return classes;
      }

      /* ==============================================================
         INITIALIZATION — Create and render the Gradebook
         ============================================================== */

      const props = {
        config: {
          fixedRightCols: 2
        },
        headerRows: generateHeaders1(),
        groups: generateGroups(),
        cellClasses: buildCellClasses(),
        cellClassFn: function (col, val) {
          if (typeof val === 'string') val = parseFloat(val);
          if (isNaN(val)) return null;
          return val < 60 ? 'score-fail' : 'score-pass';
        },
        elements: {
          thead: 'tableHead',
          tbody: 'tableBody',
          topScrollbar: 'topScrollbar',
          topDummy: 'topScrollbarDummy',
          tableContainer: 'tableContainer',
          table: 'gradebookTable',
          footerInfo: 'footerInfo'
        }
      };
      console.log(props);
      const gradebook = new Gradebook(props);

      gradebook.render();

    })();
  </script>
</body>
</html>
