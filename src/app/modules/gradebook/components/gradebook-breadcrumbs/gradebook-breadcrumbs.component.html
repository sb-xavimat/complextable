<nav class="breadcrumbs" aria-label="breadcrumb">
  <ol>
    @for (item of breadcrumbs(); track item.label) {
    <li>
      @if (item.routerLink) {
      <a [routerLink]="item.routerLink">{{ item.label }}</a>
      } @else {
      <span>{{ item.label }}</span>
      }
    </li>
    }
  </ol>
</nav>
